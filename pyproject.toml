[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlbudget"
version = "1.0.0"
description = "Local-only crawl budget planning, guarded execution, and audit reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
crawlbudget = "crawlbudget.cli:main"

[tool.setuptools]
packages = ["crawlbudget"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
