sites:
  - site_id: lease-demo
    base_url: http://127.0.0.1:5021/lease-demo/
    robots_file: robots/lease-demo.txt
    daily_quota: 5
    max_requests_per_run: 5
    max_rps: 20
    burst: 2
    crawl_delay_ms: 20
    max_response_bytes: 4096
    max_retries: 1
    enabled: true
jobs:
  - job_id: quality-sample
    site_id: lease-demo
    priority: 1
    seed_file: seeds/quality-sample.txt
    enabled: true
