sites:
  - site_id: mock-appointments
    base_url: http://127.0.0.1:5024/mock-appointments/
    robots_file: fixtures/appointments/robots.txt
    daily_quota: 6
    max_requests_per_run: 6
    max_rps: 20
    burst: 3
    crawl_delay_ms: 10
    max_response_bytes: 4096
    max_retries: 0
    timeout_ms: 2000
    enabled: true
jobs:
  - job_id: appointment-feed
    site_id: mock-appointments
    priority: 10
    seed_file: fixtures/appointments/seeds.txt
    enabled: true
